[project]
name = "bedrock-langchain-smoke"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.6",
    "langchain>=1.2.18",
    "langchain-aws>=1.4.6",
    "langchain-experimental>=0.4.1",
    "langchain-huggingface>=1.2.2",
    "langchain-openrouter>=0.2.3",
    "python-dotenv>=1.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/risk_auditor"]
